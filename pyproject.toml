[project]
name = "simple-agent"
version = "0.1.0"
description = "LLM-Agnostic Progressive Disclosure Architecture for Intelligent Agents"
readme = "README.md"
authors = [
    { name = "satish", email = "satish860@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "litellm>=1.56.3",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
]
